name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  candados:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Datos del cliente fuera de git
        run: ./scripts/guard_datos.sh
      - name: Secretos (gitleaks, historia completa)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 \
            git /repo --config /repo/.gitleaks.toml --redact --verbose

  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pytest (cuando existan pruebas)
        run: |
          if [ -d tests ]; then
            pip install -r requirements.txt
            pytest -q
          else
            echo "sin pruebas todavía (plan Fase 0, tarea 2)"
          fi
